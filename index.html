<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>

<body>
    <main>
        <article class="d-flex flex-column align-items-center justify-content-center">
            <p>Película: Avengers</p>
            <p>Género: Acción</p>
            <p>Duración: 120 minutos</p>
            <p><strong>Calificación: 4.5</strong> </p>
        </article>
        <button class="btn btn-primary">Invitación</button>
    </main>


    <script>

        const boton = document.querySelector('button')
        const parrafos = document.getElementsByTagName('p')

        boton.addEventListener('click', (e) => {
            parrafos[parrafos.length - 1].style.color = 'green'
            parrafos[parrafos.length - 1].innerText = "Recomendada para todos"
        })

    </script>
</body>

</html>
