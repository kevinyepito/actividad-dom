<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <h1 class="text-center">Calculadora IMC</h1>
    <main>
        <div class="container">
            <form action="">
                <div>
                    <label for="peso">Ingrese su peso:</label>
                    <input id="peso" type="number" min="0" step="0.1" max="400" required placeholder="KG">
                </div>
                <div>
                    <label for="estatura">Ingrese su estatura:</label>
                    <input id="estatura" type="number" min="0" step="0.01" max="3" required placeholder="Mts">
                </div>
                <button type="submit">CALCULAR</button>
            </form>

            <span id="resultado"></span>
        </div>

    </main>



    <script src="./scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
