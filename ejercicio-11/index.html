<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <form action="" class="container mt-4" style="max-width: 600px;">
        <div class="row mb-3 align-items-center">
            <label for="nombre" class="col-sm-5 col-form-label">Ingrese su nombre:</label>
            <div class="col-sm-7">
                <input id="nombre" type="text" class="form-control">
            </div>
        </div>
        <span id="nombreSpan"></span>

        <div class="row mb-3 align-items-center">
            <label for="correo" class="col-sm-5 col-form-label">Ingrese su correo:</label>
            <div class="col-sm-7">
                <input id="correo" type="text" class="form-control">
            </div>
        </div>
        <span id="correoSpan"></span>

        <div class="row mb-3 align-items-center">
            <label for="edad" class="col-sm-5 col-form-label">Ingrese su edad:</label>
            <div class="col-sm-7">
                <input id="edad" type="number" class="form-control">
            </div>
        </div>
        <span id="edadSpan"></span>

        <button class="btn btn-success">Validar</button>
    </form>

    <script src="./scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
