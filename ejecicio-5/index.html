<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>

<body>


    <main>
        <div class="d-flex align-items-center justify-content-center">

            <input type="text" placeholder="escriba un mensaje">
            <svg xmlns="http://w3.org" width="80" height="80" viewBox="0 0 64 64">
                <defs>
                    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#4f46e5" />
                        <stop offset="100%" stop-color="#3730a3" />
                    </linearGradient>
                </defs>

                <!-- Base 3D de la tecla (sombra inferior) -->
                <rect x="8" y="14" width="48" height="42" rx="10" fill="#1e1b4b" />

                <!-- Superficie superior de la tecla (se hunde) -->
                <g class="key-top">
                    <rect x="8" y="8" width="48" height="42" rx="10" fill="url(#keyGrad)" stroke="#818cf8"
                        stroke-width="1.5" />
                    <!-- Brillo superior -->
                    <path d="M 16 10 H 48" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
                </g>

                <!-- Flecha de Intro con micro-movimiento -->
                <g class="arrow-icon" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M 40 21 V 28 A 4 4 0 0 1 36 32 H 23" />
                    <polyline points="28 27 23 32 28 37" />
                </g>
            </svg>
        </div>
        <p id="texto" class="text-center"></p>
    </main>


    <script src="./scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
