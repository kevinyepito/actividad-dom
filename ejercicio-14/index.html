<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <form action="" class="d-grid gap-3">
                    <div>
                        <label for="presupuesto">Ingrese presupuesto inicial:</label>
                        <input class="form-control" type="number" name="" id="presupuesto">
                    </div>
                    <div>
                        <label for="gasto">Nombre del gasto: </label>
                        <input class="form-control" type="text" id="gasto">
                    </div>
                    <div>
                        <label for="valor">Valor del gasto: </label>
                        <input class="form-control" type="number" id="valor">
                        <span id="mensaje"></span>
                    </div>
                    <button class="btn btn-outline-primary">Agregar gasto</button>
                </form>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-6 col-md-6 col-lg-6">
                <h2>Lista de compras</h2>
                <ul>
                </ul>
            </div>
            <div class="col-6 col-md-6 col-lg-6">
                <h2>Resumen</h2>
                <p>Presupuesto inicial: <span id="inicial"></span></p>
                <p>Total gastado: <span id="gastado"></span></p>
                <p>Dinero restante <span id="restante"></span></p>
            </div>
        </div>
    </div>


    <script src="./scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
